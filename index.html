<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhammad Ramzan Chatting</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121212; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 25px; border-radius: 12px; width: 380px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #00e676; margin-top: 0; }
        input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 6px; border: none; box-sizing: border-box; }
        input { background: #2a2a2a; color: white; border: 1px solid #444; }
        button { background: #00e676; color: black; font-weight: bold; cursor: pointer; }
        button:hover { background: #00c853; }
        #chat-box { height: 320px; overflow-y: auto; background: #2a2a2a; border-radius: 6px; padding: 10px; margin-bottom: 10px; }
        .message { margin-bottom: 8px; font-size: 14px; }
        .system { color: #888; font-style: italic; text-align: center; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="login-card" class="card">
        <h2>Muhammad Ramzan Chatting</h2>
        <p style="text-align:center; font-size:13px; color:#aaa;">Enter your name to start chatting</p>
        <input type="text" id="username-input" placeholder="Type your name (e.g. David, Richard)...">
        <button onclick="login()">Join Chat</button>
    </div>

    <div id="chat-card" class="card hidden">
        <h2>Muhammad Ramzan Group Chating App</h2>
        <div id="chat-box"></div>
        <input type="text" id="message-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        const socket = io();
        let currentUser = "";

        function login() {
            const name = document.getElementById('username-input').value.trim();
            if (name !== "") {
                socket.emit('join_room', { username: name });
            }
        }

        socket.on('join_response', function(data) {
            if (data.success) {
                currentUser = data.username;
                document.getElementById('login-card').classList.add('hidden');
                document.getElementById('chat-card').classList.remove('hidden');
            }
        });

        function sendMessage() {
            const msgInput = document.getElementById('message-input');
            const msg = msgInput.value.trim();
            if (msg) {
                socket.emit('send_message', { user: currentUser, msg: msg });
                msgInput.value = '';
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        socket.on('receive_message', function(data) {
            const chatBox = document.getElementById('chat-box');
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message');

            if (data.user === 'System') {
                msgDiv.classList.add('system');
                msgDiv.innerText = data.msg;
            } else {
                msgDiv.innerHTML = `<b style="color:#00e676">${data.user}:</b> ${data.msg}`;
            }

            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    </script>
</body>
</html>
