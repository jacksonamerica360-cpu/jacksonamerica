<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Examination Percentage Calculator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        h2 { text-align: center; color: #00d2ff; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input {
            width: 95%;
            padding: 10px;
            border-radius: 6px;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.9);
            color: #000;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #00d2ff;
            border: none;
            border-radius: 6px;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }
        button:hover { background: #008ac9; color: #fff; }
        .subject-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .subject-row input { width: 50%; }
        #resultBox {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            text-align: center;
            display: none;
        }
        footer {
            margin-top: 20px;
            font-size: 11px;
            text-align: center;
            color: #aaa;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>GLOBAL PERCENTAGE CALCULATOR</h2>
    
    <div class="input-group">
        <label>Your Name</label>
        <input type="text" id="studentName" placeholder="Enter your name">
    </div>

    <div class="input-group">
        <label>Full Marks Per Subject</label>
        <input type="number" id="fullMarks" placeholder="e.g., 100">
    </div>

    <div class="input-group">
        <label>Number of Subjects</label>
        <input type="number" id="numSubjects" placeholder="e.g., 6">
    </div>

    <button onclick="generateSubjectInputs()">Set Subjects</button>

    <div id="subjectsContainer" style="margin-top: 20px;"></div>

    <button id="calcBtn" onclick="calculatePercentage()" style="display: none;">Calculate Percentage</button>

    <div id="resultBox"></div>

    <footer>
        Designed By: Jackson America Inc., Stanford, Silicon Valley, CA, USA<br>
        All Rights Reserved © Jackson America Inc. 2026<br>
        Programmer: Jackson America (17 Years Old)
    </footer>
</div>

<script>
    function generateSubjectInputs() {
        const count = document.getElementById('numSubjects').value;
        const container = document.getElementById('subjectsContainer');
        container.innerHTML = '';

        if (!count || count <= 0) return alert('Please enter a valid number of subjects.');

        for (let i = 1; i <= count; i++) {
            const row = document.createElement('div');
            row.className = 'subject-row';
            row.innerHTML = `
                <input type="text" class="subj-name" placeholder="Subject #${i} Name">
                <input type="number" class="subj-marks" placeholder="Marks Obtained">
            `;
            container.appendChild(row);
        }
        document.getElementById('calcBtn').style.display = 'block';
    }

    function calculatePercentage() {
        const name = document.getElementById('studentName').value || 'Student';
        const marksPerSubject = parseFloat(document.getElementById('fullMarks').value);
        const marksInputs = document.querySelectorAll('.subj-marks');
        
        if (!marksPerSubject || marksPerSubject <= 0) return alert('Please enter valid full marks per subject.');

        let totalObtained = 0;
        let valid = true;

        marksInputs.forEach(input => {
            const val = parseFloat(input.value);
            if (isNaN(val)) valid = false;
            else totalObtained += val;
        });

        if (!valid) return alert('Please fill in all subject marks properly.');

        const totalMaxMarks = marksInputs.length * marksPerSubject;
        const percentage = ((totalObtained / totalMaxMarks) * 100).toFixed(2);

        let remark = '';
        if (percentage >= 95) remark = `🎉 Excellent ${name}! You got 1st Rank in your examination.`;
        else if (percentage >= 90) remark = `🎉 Very Good ${name}! You got 2nd Rank in your examination.`;
        else if (percentage >= 80) remark = `🎉 Good Job ${name}! You got 3rd Rank in your class.`;
        else remark = `😔 Keep working hard ${name}! Continuous effort brings victory.`;

        const resBox = document.getElementById('resultBox');
        resBox.style.display = 'block';
        resBox.innerHTML = `
            <h3 style="color: #00d2ff; margin: 0 0 10px 0;">Percentage: ${percentage}%</h3>
            <p>${remark}</p>
        `;
    }
</script>

</body>
</html>
