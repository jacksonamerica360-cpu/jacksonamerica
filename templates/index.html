<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramzan Messaging Services | Designed By Jackson America Inc, Stanford, Silicon Valley, California, The UNITED STATES.</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: #121212; 
            color: white; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
        }

        .card { 
            background: #1e1e1e; 
            padding: 25px; 
            border-radius: 12px; 
            width: 90%; 
            max-width: 900px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            box-sizing: border-box;
        }

        h2 { text-align: center; color: #00e676; margin-top: 0; }
        input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 6px; border: none; box-sizing: border-box; }
        input { background: #2a2a2a; color: white; border: 1px solid #444; }
        button { background: #00e676; color: black; font-weight: bold; cursor: pointer; }
        button:hover { background: #00c853; }
        
        #chat-box { 
            height: 450px; 
            overflow-y: auto; 
            background: #2a2a2a; 
            border-radius: 6px; 
            padding: 15px; 
            margin-bottom: 10px; 
        }

        .message { margin-bottom: 8px; font-size: 15px; }
        .system { color: #888; font-style: italic; text-align: center; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <header>
        <h1 style="margin-bottom: 5px;">CS Class Chat room</h1>
        <h2 style="margin-top: 0; color: #00e676;">Designed by Jackson America Inc.</h2>
        <p style="margin: 2px 0; font-size: 1.1em; color: #ccc;">
            Stanford, Silicon Valley, California, United States
        </p>
        <p style="margin-top: 8px; font-style: italic; color: #aaa;">
            (Programmer is only 17 years old)
        </p>
    </header>

    <audio id="tingTongSound" src="https://cdn.freesound.org/previews/536/536108_11861866-lq.mp3" preload="auto"></audio>

    <div id="login-card" class="card">
        <h2>CS Class Chat</h2>
        <p style="text-align:center; font-size:13px; color:#aaa;">Enter your name to start chatting</p>
        <input type="text" id="username-input" placeholder="Type your name (e.g. David, Richard)...">
        <button onclick="login()">Join Chat</button>
    </div>

    <div id="chat-card" class="card hidden">
        <h2>CS Group Chat</h2>
        <div id="chat-box"></div>
        <input type="text" id="message-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        const socket = io();
        let currentUser = "";

        function login() {
            const name = document.getElementById('username-input').value.trim();
            if (name !== "") {
                // Unlock audio on first user interaction so browsers don't block it
                const sound = document.getElementById('tingTongSound');
                if (sound) {
                    sound.play().then(() => {
                        sound.pause();
                        sound.currentTime = 0;
                    }).catch(e => console.log("Audio unlock error:", e));
                }

                socket.emit('join_room', { username: name });
            }
        }

        socket.on('join_response', function(data) {
            if (data.success) {
                currentUser = data.username;
                document.getElementById('login-card').classList.add('hidden');
                document.getElementById('chat-card').classList.remove('hidden');
            }
        });

        function sendMessage() {
            const msgInput = document.getElementById('message-input');
            const msg = msgInput.value.trim();
            if (msg) {
                socket.emit('send_message', { user: currentUser, msg: msg });
                msgInput.value = '';
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        socket.on('receive_message', function(data) {
            // Play notification sound
            const sound = document.getElementById('tingTongSound');
            if (sound) {
                sound.currentTime = 0;
                sound.play().catch(e => console.log("Browser blocked audio:", e));
            }

            const chatBox = document.getElementById('chat-box');
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message');

            if (data.user === 'System') {
                msgDiv.classList.add('system');
                msgDiv.innerText = data.msg;
            } else {
                msgDiv.innerHTML = `<b style="color:#00e676">${data.user}:</b> ${data.msg}`;
            }

            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    </script>
</body>
</html>
